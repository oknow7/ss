<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SUMON IPTV - Premium Streaming</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- HLS.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        :root {
            --bg-color: #0b0f14;
            --bg-secondary: #141a23;
            --bg-card: rgba(255, 255, 255, 0.03);
            --bg-glass: rgba(20, 26, 35, 0.7);
            --text-primary: #ffffff;
            --text-secondary: #86929e;
            --accent: #ff0050;
            --accent-glow: rgba(255, 0, 80, 0.4);
            --live-green: #00ff9d;
            --border: rgba(255, 255, 255, 0.05);
            --sidebar-width: 240px;
            --bottom-nav-height: 60px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

        /* Splash Screen */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #splash-screen.hide { opacity: 0; visibility: hidden; pointer-events: none; }
        .splash-logo { font-size: 4rem; font-weight: 800; color: var(--accent); letter-spacing: 2px; animation: pulse 1.5s infinite; }
        .splash-text { color: var(--text-secondary); margin-top: 10px; letter-spacing: 4px; font-size: 0.8rem; text-transform: uppercase; }
        @keyframes pulse { 0% { opacity: 0.6; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1.05); } 100% { opacity: 0.6; transform: scale(0.95); } }

        /* App Layout */
        #app { display: flex; height: 100vh; opacity: 0; transition: opacity 0.5s ease; }
        #app.show { opacity: 1; }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width); height: 100vh; background: var(--bg-glass);
            backdrop-filter: blur(20px); border-right: 1px solid var(--border);
            padding: 20px 0; display: flex; flex-direction: column; position: fixed; top: 0; left: 0;
            z-index: 100; transition: transform 0.3s ease;
        }
        .sidebar-logo { padding: 0 20px 30px; font-size: 1.5rem; font-weight: 800; color: var(--accent); display: flex; align-items: center; gap: 10px; }
        .sidebar-nav { flex: 1; display: flex; flex-direction: column; gap: 2px; padding: 0 10px; overflow-y: auto; }
        .nav-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 15px; border-radius: 12px;
            color: var(--text-secondary); text-decoration: none; font-weight: 500; cursor: pointer; transition: all 0.2s;
        }
        .nav-item:hover, .nav-item.active { background: rgba(255, 0, 80, 0.1); color: var(--text-primary); }
        .nav-item.active { background: var(--accent); color: white; box-shadow: 0 4px 15px var(--accent-glow); }
        .nav-item i { width: 20px; text-align: center; }

        /* Main Content */
        .main-content {
            flex: 1; margin-left: var(--sidebar-width); padding-bottom: calc(var(--bottom-nav-height) + 20px);
            display: flex; flex-direction: column; width: calc(100% - var(--sidebar-width));
        }

        /* Top Bar */
        .top-bar {
            padding: 15px 30px; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; background: rgba(11, 15, 20, 0.8); backdrop-filter: blur(10px);
            z-index: 50; border-bottom: 1px solid var(--border);
        }
        .search-box {
            display: flex; align-items: center; background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: 12px; padding: 8px 15px; width: 300px; transition: border-color 0.2s;
        }
        .search-box:focus-within { border-color: var(--accent); }
        .search-box input { background: transparent; border: none; outline: none; color: white; margin-left: 10px; width: 100%; font-family: inherit; }
        .search-box input::placeholder { color: var(--text-secondary); }
        .top-bar-actions { display: flex; gap: 15px; }
        .btn-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-secondary); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
        .btn-icon:hover { color: white; border-color: var(--accent); }

        /* Content Area */
        .content-area { padding: 20px 30px; flex: 1; overflow-y: auto; }

        /* Hero */
        .hero {
            height: 300px; border-radius: 20px; background: linear-gradient(135deg, rgba(255,0,80,0.2), rgba(11,15,20,1)), url('https://images.unsplash.com/photo-1489944440615-453fc2b6a9a9?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') center/cover;
            display: flex; flex-direction: column; justify-content: flex-end; padding: 30px; margin-bottom: 30px; position: relative; overflow: hidden;
        }
        .hero::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 50%; background: linear-gradient(to top, var(--bg-color), transparent); }
        .hero-content { position: relative; z-index: 2; }
        .hero h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 10px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .hero p { color: var(--text-secondary); max-width: 500px; margin-bottom: 20px; }
        .btn-play { background: var(--accent); color: white; border: none; padding: 12px 25px; border-radius: 10px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: transform 0.2s, box-shadow 0.2s; }
        .btn-play:hover { transform: translateY(-2px); box-shadow: 0 5px 20px var(--accent-glow); }

        /* Section */
        .section { margin-bottom: 30px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .section-title { font-size: 1.3rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .section-count { font-size: 0.8rem; background: var(--bg-secondary); padding: 3px 8px; border-radius: 5px; color: var(--text-secondary); }

        /* Grid & Cards */
        .channel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
        .channel-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
            overflow: hidden; cursor: pointer; transition: all 0.3s ease; position: relative;
        }
        .channel-card:hover { transform: translateY(-5px); border-color: var(--accent); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .card-thumbnail {
            width: 100%; height: 100px; background: var(--bg-secondary); display: flex; align-items: center; justify-content: center;
            font-size: 2rem; color: var(--text-secondary); position: relative;
        }
        .live-badge {
            position: absolute; top: 8px; left: 8px; background: var(--accent); color: white;
            font-size: 0.6rem; padding: 2px 6px; border-radius: 4px; font-weight: 700;
            display: flex; align-items: center; gap: 4px;
        }
        .live-badge i { font-size: 0.4rem; color: var(--live-green); }
        .card-info { padding: 12px; display: flex; justify-content: space-between; align-items: flex-start; }
        .card-name { font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 130px; }
        .fav-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 0.9rem; transition: color 0.2s; }
        .fav-btn.active { color: var(--accent); }
        .fav-btn:hover { color: var(--accent); }

        /* Skeleton Loading */
        .skeleton-card { background: var(--bg-card); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
        .skeleton-thumb { width: 100%; height: 100px; background: linear-gradient(90deg, var(--bg-secondary) 25%, #1f2937 50%, var(--bg-secondary) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        .skeleton-text { height: 14px; margin: 12px; width: 60%; background: linear-gradient(90deg, var(--bg-secondary) 25%, #1f2937 50%, var(--bg-secondary) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 4px; }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

        /* Video Player Modal */
        .player-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95);
            z-index: 200; display: none; flex-direction: column; align-items: center; justify-content: center;
        }
        .player-overlay.active { display: flex; }
        .player-container { width: 100%; max-width: 1200px; position: relative; background: black; border-radius: 0; overflow: hidden; }
        .player-overlay.full-screen .player-container { max-width: 100%; height: 100%; border-radius: 0; }
        
        video { width: 100%; display: block; aspect-ratio: 16/9; background: black; }
        .player-overlay.full-screen video { height: 100vh; aspect-ratio: auto; }

        /* Watermark */
        #watermark {
            position: absolute; bottom: 60px; right: 20px; color: rgba(255,255,255,0.4);
            font-weight: 800; font-size: 1.2rem; letter-spacing: 2px; pointer-events: none; z-index: 10;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        /* Player Controls */
        .controls-layer {
            position: absolute; bottom: 0; left: 0; width: 100%; padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            display: flex; flex-direction: column; gap: 10px; opacity: 0; transition: opacity 0.3s;
        }
        .player-container:hover .controls-layer, .controls-layer.show { opacity: 1; }
        
        .progress-container { width: 100%; height: 5px; background: rgba(255,255,255,0.2); border-radius: 5px; cursor: pointer; position: relative; }
        .progress-buffer { position: absolute; top: 0; left: 0; height: 100%; background: rgba(255,255,255,0.3); border-radius: 5px; }
        .progress-bar { position: absolute; top: 0; left: 0; height: 100%; background: var(--accent); border-radius: 5px; }

        .controls-row { display: flex; justify-content: space-between; align-items: center; }
        .ctrl-btn { background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer; padding: 5px; transition: transform 0.2s; }
        .ctrl-btn:hover { transform: scale(1.1); }
        .channel-name-overlay { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.6); padding: 5px 12px; border-radius: 5px; font-size: 0.8rem; font-weight: 600; opacity: 0; transition: opacity 0.3s; }
        .player-container:hover .channel-name-overlay { opacity: 1; }
        
        .volume-slider { width: 0; overflow: hidden; transition: width 0.3s; background: transparent; -webkit-appearance: none; height: 4px; background: white; border-radius: 2px; margin-left: 5px; }
        .volume-group:hover .volume-slider { width: 80px; }
        
        .quality-selector { position: relative; }
        .quality-menu { position: absolute; bottom: 30px; right: 0; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; display: none; width: 120px; }
        .quality-menu.show { display: block; }
        .quality-option { padding: 8px 12px; cursor: pointer; font-size: 0.8rem; color: var(--text-secondary); transition: background 0.2s; }
        .quality-option:hover, .quality-option.active { background: var(--accent); color: white; }

        .player-loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 2rem; color: var(--accent); display: none; animation: spin 1s linear infinite; }
        .player-loader.show { display: block; }
        @keyframes spin { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }

        /* Mobile Bottom Nav */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; height: var(--bottom-nav-height);
            background: var(--bg-glass); backdrop-filter: blur(20px); border-top: 1px solid var(--border);
            display: none; justify-content: space-around; align-items: center; z-index: 100;
        }
        .bnav-item { color: var(--text-secondary); display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 0.65rem; cursor: pointer; text-decoration: none; transition: color 0.2s; }
        .bnav-item.active { color: var(--accent); }
        .bnav-item i { font-size: 1.2rem; }

        /* Toast */
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 500; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: var(--bg-secondary); border: 1px solid var(--border); padding: 12px 20px; border-radius: 10px; display: flex; align-items: center; gap: 10px; animation: slideIn 0.3s ease; border-left: 4px solid var(--accent); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* Scroll Top */
        #scrollTop { position: fixed; bottom: 80px; right: 20px; width: 40px; height: 40px; background: var(--accent); border: none; border-radius: 50%; color: white; cursor: pointer; display: none; align-items: center; justify-content: center; z-index: 90; box-shadow: 0 4px 10px var(--accent-glow); }

        /* Empty State */
        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; color: var(--text-secondary); text-align: center; }
        .empty-state i { font-size: 3rem; margin-bottom: 15px; color: var(--border); }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .main-content { margin-left: 0; width: 100%; }
            .bottom-nav { display: flex; }
            .top-bar { padding: 10px 15px; }
            .search-box { width: 100%; }
            .top-bar-actions { display: none; }
            .content-area { padding: 15px; }
            .hero { height: 200px; border-radius: 12px; padding: 15px; }
            .hero h1 { font-size: 1.5rem; }
            .channel-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
            .player-overlay { padding-top: env(safe-area-inset-top); }
            #watermark { bottom: 40px; right: 10px; font-size: 0.8rem; }
        }
    </style>
</head>

                <a class="nav-item" data-section="recent" onclick="navClick('recent')"><i class="fa-solid fa-clock-rotate-left"></i> Recent</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <header class="top-bar">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass" style="color: var(--text-secondary);"></i>
                    <input type="text" id="searchInput" placeholder="Search channels..." oninput="handleSearch()">
                </div>
                <div class="top-bar-actions">
                    <button class="btn-icon" onclick="navClick('favorites')"><i class="fa-solid fa-heart"></i></button>
                    <button class="btn-icon" onclick="navClick('recent')"><i class="fa-solid fa-clock-rotate-left"></i></button>
                </div>
            </header>

            <!-- Content Area -->
            <div class="content-area" id="contentArea">
                <!-- Dynamic content goes here -->
            </div>
        </main>
    </div>

    <!-- Mobile Bottom Nav -->
    <nav class="bottom-nav">
        <a class="bnav-item active" data-section="home" onclick="navClick('home')"><i class="fa-solid fa-house"></i>Home</a>
        <a class="bnav-item" data-section="sports" onclick="navClick('sports')"><i class="fa-solid fa-futbol"></i>Sports</a>
        <a class="bnav-item" data-section="news" onclick="navClick('news')"><i class="fa-solid fa-newspaper"></i>News</a>
        <a class="bnav-item" data-section="favorites" onclick="navClick('favorites')"><i class="fa-solid fa-heart"></i>Favs</a>
        <a class="bnav-item" data-section="recent" onclick="navClick('recent')"><i class="fa-solid fa-clock"></i>Recent</a>
    </nav>

    <!-- Video Player Overlay -->
    <div class="player-overlay" id="playerOverlay">
        <div class="player-container" id="playerContainer">
            <video id="videoPlayer" playsinline></video>
            <div class="channel-name-overlay" id="channelNameOverlay"></div>
            <div id="watermark">SUMON</div>
            <div class="player-loader show" id="playerLoader"><i class="fa-solid fa-spinner"></i></div>
            
            <div class="controls-layer show" id="controlsLayer">
                <div class="progress-container" id="progressContainer" onclick="seekVideo(event)">
                    <div class="progress-buffer" id="progressBuffer"></div>
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="controls-row">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <button class="ctrl-btn" onclick="togglePlay()"><i class="fa-solid fa-play" id="playPauseIcon"></i></button>
                        <div class="volume-group" style="display: flex; align-items: center;">
                            <button class="ctrl-btn" onclick="toggleMute()"><i class="fa-solid fa-volume-high" id="volumeIcon"></i></button>
                            <input type="range" class="volume-slider" min="0" max="1" step="0.1" value="1" oninput="setVolume(this.value)">
                        </div>
                        <span style="font-size: 0.8rem; color: var(--text-secondary);" id="timeDisplay">00:00</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <div class="quality-selector">
                            <button class="ctrl-btn" onclick="toggleQualityMenu()"><i class="fa-solid fa-gear"></i> <span id="currentQuality">Auto</span></button>
                            <div class="quality-menu" id="qualityMenu"></div>
                        </div>
                        <button class="ctrl-btn" onclick="toggleFullScreen()"><i class="fa-solid fa-expand" id="fsIcon"></i></button>
                        <button class="ctrl-btn" onclick="closePlayer()"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Scroll to Top -->
    <button id="scrollTop" onclick="window.scrollTo({top:0,behavior:'smooth'})"><i class="fa-solid fa-chevron-up"></i></button>

        // --- Global State ---
        let channels = [];
        let validatedChannels = [];
        let favorites = JSON.parse(localStorage.getItem('sumon_favs')) || [];
        let recentWatched = JSON.parse(localStorage.getItem('sumon_recent')) || [];
        let currentSection = 'home';
        let searchQuery = '';
        
        // Player State
        let hls = null;
        let playerChannelData = null;
        let hideControlsTimeout;

        // --- Parse M3U ---
        function parseM3U(raw) {
            const lines = raw.split('\n');
            const parsed = [];
            for (let i = 0; i < lines.length; i++) {
                if (lines[i].includes('#EXTINF')) {
                    const match = lines[i].match(/,(.*)/);
                    if (match) {
                        const name = match[1].trim();
                        let url = '';
                        // Look for the URL on the next lines
                        for (let j = i + 1; j < lines.length; j++) {
                            const line = lines[j].trim();
                            if (line && !line.startsWith('#')) {
                                url = line;
                                i = j; // Skip forward
                                break;
                            }
                        }
                        if (url && name) {
                            const id = btoa(unescape(encodeURIComponent(name+url))).substring(0, 12);
                            parsed.push({ name, url, id, category: categorize(name) });
                        }
                    }
                }
            }
            return parsed;
        }

        function categorize(name) {
            const n = name.toLowerCase();
            const sportKeys = ['sport', 'espn', 'fox', 'bein', 'dazn', 'tnt', 'tyc', 'win', 'fifa', 'cricket', 'gazi', 'tsports', 'a sports', 'ptv', 'willow', 'real madrid', 'red bull'];
            const newsKeys = ['news', 'somoy', 'jamuna', 'atn', 'dbc', 'ekattor', 'channel 24', 'independent', 'satv', 'jago'];
            const movieKeys = ['movie', 'prince', 'domm', 'rakkhosh', 'bonolota', 'sony max', 'sony max 2'];
            
            if(sportKeys.some(k => n.includes(k))) return 'sports';
            if(newsKeys.some(k => n.includes(k))) return 'news';
            if(movieKeys.some(k => n.includes(k))) return 'movies';
            return 'entertainment';
        }

        // --- Stream Validation ---
        async function validateStreams(chs) {
            showToast('Validating streams...', 'info');
            const valid = [];
            // Process in batches of 5 to avoid overwhelming the browser
            for(let i = 0; i < chs.length; i+=5) {
                const batch = chs.slice(i, i+5);
                const results = await Promise.all(batch.map(async (ch) => {
                    return new Promise((resolve) => {
                        if (!Hls.isSupported()) {
                            // Fallback for native support (Safari)
                            const video = document.createElement('video');
                            video.src = ch.url;
                            video.addEventListener('canplay', () => { video.remove(); resolve(ch); }, {once: true});
                            video.addEventListener('error', () => { video.remove(); resolve(null); }, {once: true});
                            setTimeout(() => { video.remove(); resolve(null); }, 4000);
                            return;
                        }
                        
                        const tempHls = new Hls({ enableWorker: false, manifestLoadingTimeOut: 3000, manifestLoadingMaxRetry: 1 });
                        const video = document.createElement('video');
                        let settled = false;
                        
                        tempHls.loadSource(ch.url);
                        tempHls.attachMedia(video);
                        
                        const success = () => { if(settled) return; settled = true; tempHls.destroy(); video.remove(); resolve(ch); };
                        const fail = () => { if(settled) return; settled = true; tempHls.destroy(); video.remove(); resolve(null); };
                        
                        tempHls.on(Hls.Events.MANIFEST_PARSED, success);
                        tempHls.on(Hls.Events.ERROR, (event, data) => { if(data.fatal) fail(); });
                        setTimeout(fail, 4000);
                    });
                }));
                
                results.forEach(r => { if(r) valid.push(r); });
                // Update UI progressively
                validatedChannels = [...valid];
                if(currentSection === 'home') renderUI(); 
            }
            showToast(`Found ${valid.length} working channels!`, 'success');
            validatedChannels = valid;
            renderUI();
        }

        // --- UI Rendering ---
        const getChannelsByCategory = (cat) => validatedChannels.filter(c => c.category === cat);
        const getFavChannels = () => validatedChannels.filter(c => favorites.includes(c.id));
        const getRecentChannels = () => {
            // Reversing to show latest first, and ensuring they still exist in validated list
            return [...recentWatched].reverse().map(id => validatedChannels.find(c => c.id === id)).filter(Boolean);
        };

        function renderUI() {
            const area = document.getElementById('contentArea');
            let html = '';

            const filterBySearch = (list) => list.filter(c => c.name.toLowerCase().includes(searchQuery));

            if(currentSection === 'home') {
                html += `
                    <div class="hero">
                        <div class="hero-content">
                            <h1>SUMON IPTV</h1>
                            <p>Ultra premium streaming experience. Live sports, news, and entertainment in high quality.</p>
                            <button class="btn-play" onclick="navClick('sports')"><i class="fa-solid fa-play"></i> Watch Live</button>
                        </div>
                    </div>
                `;
                const sports = filterBySearch(getChannelsByCategory('sports'));
                const news = filterBySearch(getChannelsByCategory('news'));
                const ent = filterBySearch(getChannelsByCategory('entertainment'));
                const movies = filterBySearch(getChannelsByCategory('movies'));
                const favs = filterBySearch(getFavChannels());
                const recent = filterBySearch(getRecentChannels());

                if(recent.length > 0) html += renderSection('Recently Watched', recent, 'recent');
                if(favs.length > 0) html += renderSection('Favorites', favs, 'favorites');
                if(sports.length > 0) html += renderSection('Sports', sports, 'sports');
                if(news.length > 0) html += renderSection('News', news, 'news');
                if(ent.length > 0) html += renderSection('Entertainment', ent, 'entertainment');
                if(movies.length > 0) html += renderSection('Movies', movies, 'movies');

            } else if(currentSection === 'favorites' || currentSection === 'recent') {
                const list = currentSection === 'favorites' ? filterBySearch(getFavChannels()) : filterBySearch(getRecentChannels());
                if(list.length === 0) {
                    html += `<div class="empty-state"><i class="fa-solid fa-heart-crack"></i><h3>Nothing here yet</h3><p>${currentSection === 'favorites' ? 'Add channels to favorites by clicking the heart icon.' : 'Channels you watch will appear here.'}</p></div>`;
                } else {
                    html += renderSection(currentSection === 'favorites' ? 'Favorites' : 'Recently Watched', list, currentSection);
                }
            } else {
                const list = filterBySearch(getChannelsByCategory(currentSection));
                if(list.length === 0 && searchQuery) {
                    html += `<div class="empty-state"><i class="fa-solid fa-magnifying-glass"></i><h3>No results found</h3></div>`;
                } else {
                    html += renderSection(currentSection.charAt(0).toUpperCase() + currentSection.slice(1), list, currentSection);
                }
            }

            if(validatedChannels.length === 0 && !searchQuery) {
                html = Array(8).fill().map(() => `<div class="skeleton-card"><div class="skeleton-thumb"></div><div class="skeleton-text"></div></div>`).join('');
            }

            area.innerHTML = html;
        }

        function renderSection(title, channels, sectionId) {
            return `
                <div class="section" id="section-${sectionId}">
                    <div class="section-header">
                        <div class="section-title">${title} <span class="section-count">${channels.length}</span></div>
                    </div>
                    <div class="channel-grid">
                        ${channels.map(c => renderCard(c)).join('')}
                    </div>
                </div>
            `;
        }

        function renderCard(ch) {
            const isFav = favorites.includes(ch.id);
            return `
                <div class="channel-card" onclick="playChannel('${ch.id}')">
                    <div class="card-thumbnail">
                        <i class="fa-solid fa-tv"></i>
                        <div class="live-badge"><i class="fa-solid fa-circle"></i> LIVE</div>
                    </div>
                    <div class="card-info">
                        <div class="card-name" title="${ch.name}">${ch.name}</div>
                        <button class="fav-btn ${isFav ? 'active' : ''}" onclick="event.stopPropagation(); toggleFav('${ch.id}')">
                            <i class="fa-${isFav ? 'solid' : 'regular'} fa-heart"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        // --- Navigation & State ---
        function navClick(section) {
            currentSection = section;
            document.querySelectorAll('.nav-item, .bnav-item').forEach(el => {
                el.classList.toggle('active', el.getAttribute('data-section') === section);
            });
            renderUI();
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value.toLowerCase();
            renderUI();
        }

        function toggleFav(id) {
            if(favorites.includes(id)) {
                favorites = favorites.filter(f => f !== id);
                showToast('Removed from favorites', 'info');
            } else {
                favorites.push(id);
                showToast('Added to favorites', 'success');
            }
            localStorage.setItem('sumon_favs', JSON.stringify(favorites));
            renderUI();
        }

        // --- Video Player Logic ---
        function playChannel(id) {
            const ch = validatedChannels.find(c => c.id === id) || channels.find(c => c.id === id);
            if(!ch) return;

            playerChannelData = ch;
            
            // Update Recent
            recentWatched = recentWatched.filter(r => r !== id);
            recentWatched.push(id);
            if(recentWatched.length > 20) recentWatched.shift();
            localStorage.setItem('sumon_recent', JSON.stringify(recentWatched));

            const video = document.getElementById('videoPlayer');
            document.getElementById('channelNameOverlay').innerText = ch.name;
            document.getElementById('playerLoader').classList.add('show');
            document.getElementById('playerOverlay').classList.add('active');
            document.getElementById('playPauseIcon').className = 'fa-solid fa-pause';
            document.getElementById('controlsLayer').classList.add('show');

            if (hls) { hls.destroy(); }

            if (Hls.isSupported()) {
                hls = new Hls({ enableWorker: true, backBufferLength: 90 });
                hls.loadSource(ch.url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play();
                    setupQualityLevels();
                });
                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        document.getElementById('playerLoader').classList.remove('show');
                        showToast('Stream disconnected. Retrying...', 'error');
                        setTimeout(() => playChannel(id), 3000);
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Native HLS support (Safari)
                video.src = ch.url;
                video.addEventListener('loadedmetadata', () => video.play());
            }
            
            setupPlayerEvents();
        }

        function setupQualityLevels() {
            const menu = document.getElementById('qualityMenu');
            menu.innerHTML = `<div class="quality-option active" onclick="setQuality(-1)">Auto</div>`;
            if(hls && hls.levels.length > 1) {
                hls.levels.forEach((level, i) => {
                    const res = level.height ? `${level.height}p` : `Level ${i+1}`;
                    menu.innerHTML += `<div class="quality-option" onclick="setQuality(${i})">${res}</div>`;
                });
            }
        }

        function setQuality(index) {
            if(hls) hls.currentLevel = index;
            document.getElementById('currentQuality').innerText = index === -1 ? 'Auto' : `${hls.levels[index].height}p`;
            document.querySelectorAll('.quality-option').forEach((el, i) => el.classList.toggle('active', i === index + 1));
            toggleQualityMenu();
        }

        function toggleQualityMenu() {
            document.getElementById('qualityMenu').classList.toggle('show');
        }

        function setupPlayerEvents() {
            const video = document.getElementById('videoPlayer');
            video.onplay = () => { document.getElementById('playPauseIcon').className = 'fa-solid fa-pause'; };
            video.onpause = () => { document.getElementById('playPauseIcon').className = 'fa-solid fa-play'; };
            video.onwaiting = () => document.getElementById('playerLoader').classList.add('show');
            video.onplaying = () => document.getElementById('playerLoader').classList.remove('show');
            
            video.ontimeupdate = () => {
                if(!video.duration) return;
                const progress = (video.currentTime / video.duration) * 100;
                document.getElementById('progressBar').style.width = `${progress}%`;
            };

            // Progress buffer
            if(hls) {
                hls.on(Hls.Events.FRAG_BUFFERED, () => {
                    if(video.buffered.length > 0) {
                        const bufferedEnd = video.buffered.end(video.buffered.length - 1);
                        const duration = video.duration;
                        if (duration > 0) {
                            const bufferWidth = (bufferedEnd / duration) * 100;
                            document.getElementById('progressBuffer').style.width = `${bufferWidth}%`;
                        }
                    }
                });
            }
        }

        function togglePlay() {
            const video = document.getElementById('videoPlayer');
            video.paused ? video.play() : video.pause();
        }

        function toggleMute() {
            const video = document.getElementById('videoPlayer');
            video.muted = !video.muted;
            document.getElementById('volumeIcon').className = video.muted ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
        }

        function setVolume(val) {
            const video = document.getElementById('videoPlayer');
            video.volume = val;
            video.muted = val == 0;
            document.getElementById('volumeIcon').className = val == 0 ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
        }

        function seekVideo(e) {
            const video = document.getElementById('videoPlayer');
            const rect = e.target.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            video.currentTime = pos * video.duration;
        }

        function toggleFullScreen() {
            const container = document.getElementById('playerOverlay');
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => console.log(err));
                container.classList.add('full-screen');
                document.getElementById('fsIcon').className = 'fa-solid fa-compress';
            } else {
                document.exitFullscreen();
                container.classList.remove('full-screen');
                document.getElementById('fsIcon').className = 'fa-solid fa-expand';
            }
        }

        function closePlayer() {
            const video = document.getElementById('videoPlayer');
            video.pause();
            if(hls) hls.destroy();
            hls = null;
            document.getElementById('playerOverlay').classList.remove('active');
            document.getElementById('playerOverlay').classList.remove('full-screen');
            document.getElementById('qualityMenu').classList.remove('show');
            renderUI(); // Refresh recent list
        }

        // --- Utilities ---
        function showToast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i> ${msg}`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        window.addEventListener('scroll', () => {
            document.getElementById('scrollTop').style.display = window.scrollY > 300 ? 'flex' : 'none';
        });

        // --- Initialization ---
        window.onload = () => {
            channels = parseM3U(rawM3U);
            // Show splash for 1.5s then start
            setTimeout(() => {
                document.getElementById('splash-screen').classList.add('hide');
                document.getElementById('app').classList.add('show');
                renderUI(); // Initial skeleton render
                validateStreams(channels); // Start background validation
            }, 1500);
        };
    </script>
