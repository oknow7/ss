<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Live TV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-color: #141414;
            --header-bg: rgba(20, 20, 20, 0.85);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-hover: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --accent: #e50914;
            --glass-border: rgba(255, 255, 255, 0.1);
            --online-green: #00e676;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        /* Scan Overlay */
        #scan-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }
        #scan-overlay.hidden { opacity: 0; pointer-events: none; }
        .scanner { width: 60px; height: 60px; border: 4px solid rgba(255,255,255,0.2); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .scan-text { font-size: 18px; color: var(--text-secondary); }

        /* Header */
        header {
            position: sticky;
            top: 0; z-index: 100;
            background: var(--header-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .logo {
            font-size: 24px; font-weight: 800; letter-spacing: -1px; color: var(--accent);
            display: flex; align-items: center; gap: 8px; flex-shrink: 0;
        }
        .logo svg { width: 28px; height: 28px; fill: var(--accent); }

        .header-controls {
            display: flex; align-items: center; gap: 15px; width: 100%; max-width: 600px;
        }

        .search-box {
            position: relative; flex-grow: 1;
        }
        .search-box input {
            width: 100%; padding: 10px 15px 10px 40px; border-radius: 8px;
            border: 1px solid var(--glass-border); background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary); font-size: 14px; outline: none; transition: all 0.3s ease;
        }
        .search-box input:focus { border-color: var(--accent); background: rgba(255, 255, 255, 0.1); }
        .search-box svg {
            position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
            width: 16px; height: 16px; stroke: var(--text-secondary);
        }

        .counter {
            background: rgba(0, 230, 118, 0.1); color: var(--online-green);
            padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: 600;
            border: 1px solid rgba(0, 230, 118, 0.2); white-space: nowrap; flex-shrink: 0;
        }

        /* Main Content */
        main { max-width: 1400px; margin: 0 auto; padding: 20px; }

        .player-container {
            position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 75vh;
            background: #000; border-radius: 12px; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); margin-bottom: 20px;
        }
        video { width: 100%; height: 100%; object-fit: contain; display: block; }

        #fullscreen-btn {
            position: absolute; bottom: 15px; right: 15px;
            background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255,255,255,0.2);
            color: white; width: 40px; height: 40px; border-radius: 8px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: background 0.2s; z-index: 20;
        }
        #fullscreen-btn:hover { background: rgba(229, 9, 20, 0.8); }

        .now-playing {
            display: flex; align-items: center; gap: 12px;
            margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid var(--glass-border);
        }
        .live-badge {
            background: var(--accent); color: white; padding: 4px 8px; border-radius: 4px;
            font-size: 12px; font-weight: 800; letter-spacing: 1px;
            display: flex; align-items: center; gap: 5px; animation: pulse 2s infinite;
        }
        .live-dot { width: 6px; height: 6px; background: white; border-radius: 50%; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .channel-title { font-size: 20px; font-weight: 600; }

        /* Grid */
        .channels-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px;
        }

        .channel-card {
            background: var(--card-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border); border-radius: 10px; padding: 15px;
            cursor: pointer; transition: all 0.3s ease; display: flex; flex-direction: column;
            align-items: center; text-align: center; position: relative; overflow: hidden;
            animation: fadeIn 0.5s ease forwards;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .channel-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 100%);
            opacity: 0; transition: opacity 0.3s ease;
        }
        .channel-card:hover {
            transform: translateY(-5px); border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4); background: var(--card-hover);
        }
        .channel-card:hover::before { opacity: 1; }

        .channel-card.active {
            border-color: var(--accent); box-shadow: 0 0 15px rgba(229, 9, 20, 0.3); background: rgba(229, 9, 20, 0.1);
        }

        .logo-initials {
            width: 50px; height: 50px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; font-weight: 800; margin-bottom: 10px;
            color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: transform 0.3s ease;
        }
        .channel-card:hover .logo-initials { transform: scale(1.1); }

        .card-name {
            font-size: 13px; font-weight: 500; color: var(--text-primary); line-height: 1.3;
            max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%;
        }

        .status-indicator {
            position: absolute; top: 10px; right: 10px; width: 8px; height: 8px;
            background: var(--online-green); border-radius: 50%; box-shadow: 0 0 5px var(--online-green);
        }

        .no-results { grid-column: 1 / -1; text-align: center; color: var(--text-secondary); padding: 40px 0; font-size: 16px; }

        @media (max-width: 768px) {
            header { flex-wrap: wrap; gap: 10px; padding: 10px; }
            .search-box { order: 3; width: 100%; }
            .channels-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
            .channel-title { font-size: 16px; }
        }
    </style>
</head>

        let currentPlayingId = null;
        let activeHls = null;
        let scanIndex = 0;

        const video = document.getElementById('video');
        const channelNameEl = document.getElementById('channel-name');
        const channelsGrid = document.getElementById('channels-grid');
        const searchInput = document.getElementById('search');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const scanOverlay = document.getElementById('scan-overlay');
        const counterEl = document.getElementById('counter');

        // Initialize Channel Data
        rawChannels.forEach((ch, idx) => {
            ch.id = idx;
            let hash = 0;
            for (let i = 0; i < ch.name.length; i++) {
                hash = ch.name.charCodeAt(i) + ((hash << 5) - hash);
            }
            const h = hash % 360;
            ch.color = `hsl(${h < 0 ? h + 360 : h}, 65%, 25%)`;
            ch.initials = ch.name.replace(/[^a-zA-Z0-9À-ÿ]/g, ' ').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase() || "TV";
        });

        function updateCounter() {
            counterEl.textContent = `Working: ${onlineChannels.length}`;
        }

        // Probe Logic: Tests a single channel with retries and timeout
        function probeChannel(channel) {
            return new Promise((resolve) => {
                let retries = 0;
                const maxRetries = 3;
                const timeoutMs = 8000;

                function attempt() {
                    if (retries >= maxRetries) {
                        resolve(false);
                        return;
                    }
                    retries++;
                    
                    // Temp video element for probing
                    const probeVideo = document.createElement('video');
                    const hls = new Hls({
                        enableWorker: false,
                        maxBufferLength: 1,
                        maxMaxBufferLength: 1,
                        manifestLoadingTimeOut: timeoutMs,
                        manifestLoadingMaxRetry: 0,
                        levelLoadingTimeOut: timeoutMs,
                        fragLoadingTimeOut: timeoutMs
                    });
                    
                    let settled = false;
                    let timer = setTimeout(() => {
                        if (!settled) {
                            settled = true;
                            hls.destroy();
                            probeVideo.remove();
                            attempt(); // retry on timeout
                        }
                    }, timeoutMs + 500); // small buffer for network lag

                    hls.attachMedia(probeVideo);
                    hls.loadSource(channel.url);

                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        if (!settled) {
                            settled = true;
                            clearTimeout(timer);
                            hls.destroy();
                            probeVideo.remove();
                            resolve(true);
                        }
                    });

                    hls.on(Hls.Events.ERROR, (event, data) => {
                        if (data.fatal && !settled) {
                            settled = true;
                            clearTimeout(timer);
                            hls.destroy();
                            probeVideo.remove();
                            attempt(); // retry on error
                        }
                    });
                }
                attempt();
            });
        }

        // Scanning Batches to prevent browser overload
        async function scanChannels() {
            const concurrencyLimit = 8;
            let index = 0;
            
            async function next() {
                if (index >= rawChannels.length) return;
                const ch = rawChannels[index++];
                const isOnline = await probeChannel(ch);
                
                if (isOnline) {
                    onlineChannels.push(ch);
                    addChannelToGrid(ch);
                    updateCounter();
                    
                    // Auto-play the first working channel immediately
                    if (!currentPlayingId) {
                        playChannel(ch.id);
                    }
                }
                return next(); // recursively start next
            }
            
            const workers = [];
            for (let i = 0; i < concurrencyLimit; i++) {
                workers.push(next());
            }
            await Promise.all(workers);
            
            // Hide scanning overlay when done
            scanOverlay.classList.add('hidden');

                scanIndex++;
                
                // Don't probe the currently playing one; main player handles its errors
                if (ch.id === currentPlayingId) return;
                
                const isOnline = await probeChannel(ch);
                if (!isOnline) {
                    removeChannelFromGrid(ch.id);
                }
            }, 12000);

            });

            if (Hls.isSupported()) {
                activeHls = new Hls({ enableWorker: true, lowLatencyMode: true });
                activeHls.loadSource(channel.url);
                activeHls.attachMedia(video);
                
                activeHls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(e => console.log("Autoplay blocked"));
                });
                
                activeHls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {

                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = channel.url;
                video.addEventListener('loadedmetadata', () => {
                    video.play().catch(e => console.log("Autoplay blocked"));
                });
                video.addEventListener('error', handleCurrentChannelFailure);
            }
        }

            } else {
                channelNameEl.textContent = "No channels available";
                if(activeHls) activeHls.destroy();
                video.src = '';
            }
        }

        // Grid Management
        function addChannelToGrid(ch) {
            const card = document.createElement('div');
            card.className = 'channel-card';
            card.dataset.id = ch.id;
            card.dataset.name = ch.name.toLowerCase();
            
            card.innerHTML = `
                <div class="status-indicator"></div>
                <div class="logo-initials" style="background: ${ch.color}">${ch.initials}</div>
                <div class="card-name" title="${ch.name}">${ch.name}</div>
            `;

            card.addEventListener('click', () => playChannel(ch.id));
            channelsGrid.appendChild(card);
        }

        function removeChannelFromGrid(id) {
            // Remove from state
            onlineChannels = onlineChannels.filter(c => c.id !== id);
            updateCounter();
            
            // Remove from DOM
            const card = channelsGrid.querySelector(`[data-id="${id}"]`);
            if (card) {
                card.style.transition = 'opacity 0.3s, transform 0.3s';
                card.style.opacity = '0';
                card.style.transform = 'scale(0.8)';
                setTimeout(() => card.remove(), 300);
            }

            // If the currently playing channel is removed, switch
            if (id === currentPlayingId) {
                handleCurrentChannelFailure();
            }
        }

        // Search Functionality
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const cards = channelsGrid.querySelectorAll('.channel-card');
            let visibleCount = 0;
            
            cards.forEach(card => {
                const name = card.dataset.name;
                const isVisible = name.includes(query);
                card.style.display = isVisible ? 'flex' : 'none';
                if(isVisible) visibleCount++;
            });

            const noResults = channelsGrid.querySelector('.no-results');
            if (noResults) noResults.remove();

            if (visibleCount === 0 && onlineChannels.length > 0) {
                channelsGrid.innerHTML = '<div class="no-results">No channels found matching your search</div>';
            }
        });

        // Fullscreen
        fullscreenBtn.addEventListener('click', () => {
            if (video.requestFullscreen) video.requestFullscreen();
            else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
            else if (video.msRequestFullscreen) video.msRequestFullscreen();
        });

        // Init
        scanChannels();
        startBackgroundMonitor();
    </script>
</body>
</html>
